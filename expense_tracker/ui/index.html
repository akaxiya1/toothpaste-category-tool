<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>秒级记账</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .kbd { padding: 1px 6px; font-size: 11px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; }
    .ring-bg { fill: none; stroke: #e2e8f0; stroke-width: 6; }
    .ring-fg { fill: none; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset .4s ease; }
    .ring-low  { stroke: #10b981; }
    .ring-ok   { stroke: #3b82f6; }
    .ring-warn { stroke: #f59e0b; }
    .ring-over { stroke: #ef4444; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-3xl mx-auto p-6 space-y-6">
  <header class="flex items-baseline justify-between">
    <h1 class="text-2xl font-semibold">秒级记账</h1>
    <div class="flex items-center gap-3 text-sm">
      <button id="settingsBtn" class="text-blue-600">设置</button>
      <a class="text-blue-600 underline" href="/export.csv">导出 CSV</a>
    </div>
  </header>

  <div id="alertBar" class="hidden"></div>
  <div id="budgetRings" class="hidden bg-white shadow-sm rounded-xl p-4"></div>

  <section class="bg-white shadow-sm rounded-xl p-5 space-y-3">
    <h2 class="font-medium">粘贴账单文本</h2>
    <p class="text-sm text-slate-500">
      粘贴后按 <span class="kbd">Enter</span> 解析；解析完成后按
      <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> 直接落库。
    </p>
    <textarea id="raw" rows="3"
      class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="例：微信支付 -15.00元 商户：瑞幸咖啡"></textarea>
    <div class="flex gap-2">
      <button id="parseBtn" class="bg-blue-600 text-white px-4 py-1.5 rounded-md text-sm">解析</button>
      <button id="pasteBtn" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md text-sm">读取剪贴板</button>
      <span id="hint" class="text-sm text-slate-500 self-center"></span>
    </div>
  </section>

  <section id="preview" class="bg-white shadow-sm rounded-xl p-5 space-y-3 hidden">
    <div class="flex items-center justify-between">
      <h2 class="font-medium">解析结果</h2>
      <button id="undoBtn" class="hidden text-xs text-slate-500 hover:text-slate-700" title="撤销最近一笔">撤销</button>
    </div>

    <div id="aliasSuggest" class="hidden text-sm rounded-md p-2 bg-indigo-50 text-indigo-800 border border-indigo-200"></div>

    <div id="candidates" class="hidden space-y-1.5"></div>

    <div class="grid grid-cols-2 gap-3 text-sm">
      <label>金额 <input id="f-amount" type="number" step="0.01" class="w-full border rounded p-1.5" /></label>
      <label>方向
        <select id="f-direction" class="w-full border rounded p-1.5">
          <option value="expense">支出</option>
          <option value="income">收入</option>
          <option value="refund">退款</option>
          <option value="transfer">转账</option>
        </select>
      </label>
      <label>商户 <input id="f-merchant" class="w-full border rounded p-1.5" /></label>
      <label>账户 <input id="f-account" class="w-full border rounded p-1.5" placeholder="微信/支付宝/卡尾号" /></label>
      <label>分类 <input id="f-category" class="w-full border rounded p-1.5" /></label>
      <label>子分类 <input id="f-subcategory" class="w-full border rounded p-1.5" /></label>
      <label class="col-span-2">发生时间 <input id="f-occurred" class="w-full border rounded p-1.5" /></label>
      <label class="col-span-2">备注 <input id="f-note" class="w-full border rounded p-1.5" /></label>
    </div>
    <div id="confBanner" class="text-sm rounded-md p-2"></div>
    <div class="flex gap-2 justify-end">
      <button id="cancelBtn" class="text-slate-500 px-3">取消 (Esc)</button>
      <button id="confirmBtn" class="bg-emerald-600 text-white px-4 py-1.5 rounded-md text-sm">确认 (Enter)</button>
    </div>
  </section>

  <section class="bg-white shadow-sm rounded-xl p-5 space-y-3">
    <div class="flex justify-between items-center">
      <h2 class="font-medium">最近流水</h2>
      <button id="refreshBtn" class="text-sm text-blue-600">刷新</button>
    </div>
    <div id="txList" class="divide-y text-sm"></div>
  </section>

  <section class="bg-white shadow-sm rounded-xl p-5 space-y-3">
    <h2 class="font-medium">近 30 天分类统计</h2>
    <div id="stats" class="text-sm text-slate-700"></div>
  </section>
</div>

<!-- Settings drawer -->
<div id="settings" class="fixed inset-0 bg-black/30 hidden z-10" role="dialog">
  <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white p-5 overflow-y-auto space-y-5">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-semibold">设置</h2>
      <button id="settingsClose" class="text-slate-500">关闭</button>
    </div>

    <div id="settingsFeatures" class="text-xs text-slate-500"></div>

    <div>
      <h3 class="font-medium mb-2">商户别名</h3>
      <p class="text-xs text-slate-500 mb-2">把"瑞幸咖啡(上海店)"映射到"瑞幸咖啡"，避免学习闭环分裂。</p>
      <div class="flex gap-2 mb-2">
        <input id="aliasFrom" placeholder="别名" class="flex-1 border rounded p-1.5 text-sm" />
        <input id="aliasTo" placeholder="标准名" class="flex-1 border rounded p-1.5 text-sm" />
        <button id="aliasAdd" class="bg-blue-600 text-white px-3 rounded text-sm">合并</button>
      </div>
      <div id="aliasList" class="text-sm space-y-1"></div>
    </div>

    <div id="reconcileSection" class="hidden">
      <h3 class="font-medium mb-2">对账校验</h3>
      <p class="text-xs text-slate-500 mb-2">粘贴微信/支付宝导出的 CSV，高亮漏记 / 重复 / 金额不符。不会自动落库，由你勾选导入。</p>
      <textarea id="reconcileCsv" rows="4" class="w-full border rounded p-1.5 text-xs font-mono"
        placeholder="粘贴 CSV 全文（含头部元信息也可以）"></textarea>
      <div class="flex gap-2 mt-2">
        <button id="reconcileRun" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm">解析对账</button>
        <button id="reconcileImport" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm hidden">导入勾选</button>
        <span id="reconcileStats" class="text-xs text-slate-500 self-center"></span>
      </div>
      <div id="reconcileOut" class="mt-2 space-y-2 text-sm"></div>
    </div>

    <div>
      <h3 class="font-medium mb-2">每日总结</h3>
      <p class="text-xs text-slate-500 mb-2">在 <code>config.yaml</code> 打开后，这里可以预览今天的总结文案，或立刻推送一次测试。</p>
      <div class="flex gap-2">
        <button id="digestPreview" class="bg-slate-100 px-3 py-1.5 rounded text-sm">预览今日</button>
        <button id="digestTest" class="bg-slate-100 px-3 py-1.5 rounded text-sm">推送测试</button>
      </div>
      <pre id="digestOut" class="mt-2 text-xs whitespace-pre-wrap bg-slate-50 border rounded p-2 hidden"></pre>
    </div>
  </div>
</div>

<!-- Command palette (Ctrl+K / Cmd+K) -->
<div id="cmdPalette" class="fixed inset-0 bg-black/40 hidden z-20" role="dialog">
  <div class="max-w-xl mx-auto mt-20 bg-white rounded-xl shadow-xl overflow-hidden">
    <div class="p-3 border-b flex items-center gap-2">
      <input id="cmdInput" class="flex-1 outline-none text-sm" autocomplete="off"
        placeholder="例：上周咖啡 超过50  /  本月 打车  /  瑞幸 >100  /  2026-04 京东" />
      <span class="text-xs text-slate-400">Esc 关闭</span>
    </div>
    <div id="cmdSummary" class="px-3 py-2 text-xs bg-slate-50 text-slate-600 border-b hidden"></div>
    <ul id="cmdResults" class="max-h-96 overflow-y-auto divide-y text-sm"></ul>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let preview = null;
let features = {};
let lastInsertId = null;
let undoTimer = null;

async function loadFeatures() {
  try { features = await (await fetch("/features")).json(); } catch { features = {}; }
  $("settingsFeatures").textContent = "已启用: " + Object.entries(features)
    .filter(([,v]) => v).map(([k]) => k).join(", ");
}

async function parseText() {
  const text = $("raw").value.trim();
  if (!text) return;
  $("hint").textContent = "解析中...";
  try {
    const r = await fetch("/intake", { method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({text}) });
    if (!r.ok) { $("hint").textContent = "无法解析: " + await r.text(); return; }
    preview = await r.json();
    $("hint").textContent = "";
    showPreview(preview);
  } catch (e) { $("hint").textContent = "网络错误"; }
}

function showPreview(p) {
  $("preview").classList.remove("hidden");
  $("f-amount").value = p.amount ?? "";
  $("f-direction").value = p.direction;
  $("f-merchant").value = p.merchant ?? "";
  $("f-account").value = p.account ?? "";
  $("f-category").value = p.category;
  $("f-subcategory").value = p.subcategory ?? "";
  $("f-occurred").value = p.occurred_at ?? "";
  $("f-note").value = "";

  // alias suggestion
  const aliasBox = $("aliasSuggest");
  if (p.alias_suggestion) {
    const s = p.alias_suggestion;
    aliasBox.innerHTML = `检测到相似商户 <b>${s.canonical}</b> (原因: ${s.reason})，
      <a class="underline cursor-pointer" id="aliasAccept">一键合并</a> ·
      <a class="underline cursor-pointer text-slate-500" id="aliasDismiss">忽略</a>`;
    aliasBox.classList.remove("hidden");
    $("aliasAccept").onclick = async () => {
      await fetch("/aliases", { method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({alias: s.alias, canonical: s.canonical, merge_history: true})});
      $("f-merchant").value = s.canonical;
      aliasBox.classList.add("hidden");
    };
    $("aliasDismiss").onclick = () => aliasBox.classList.add("hidden");
  } else {
    aliasBox.classList.add("hidden");
  }

  // candidates
  const cands = $("candidates");
  if (p.candidates && p.candidates.length) {
    cands.innerHTML = p.candidates.map((c, i) => {
      const confPct = Math.round(c.confidence * 100);
      return `<button class="w-full text-left px-3 py-2 rounded-md border hover:bg-blue-50 flex justify-between items-center"
                      data-idx="${i}">
        <span><span class="kbd mr-2">${i+1}</span>${c.category}${c.subcategory ? ' · ' + c.subcategory : ''}</span>
        <span class="text-xs text-slate-400">${confPct}% · ${c.source}</span>
      </button>`;
    }).join("");
    cands.classList.remove("hidden");
    [...cands.querySelectorAll("button")].forEach(btn => {
      btn.onclick = () => pickCandidate(parseInt(btn.dataset.idx));
    });
  } else {
    cands.classList.add("hidden");
  }

  const banner = $("confBanner");
  const conf = Math.round((p.confidence || 0) * 100);
  if (p.needs_confirmation) {
    banner.className = "text-sm rounded-md p-2 bg-amber-50 text-amber-700 border border-amber-200";
    banner.textContent = `置信度 ${conf}% (来源: ${p.classifier_source}) — 请确认或按 1/2/3 选分类。`;
  } else {
    banner.className = "text-sm rounded-md p-2 bg-emerald-50 text-emerald-700 border border-emerald-200";
    banner.textContent = `置信度 ${conf}% — 按 Enter 直接确认，或 1/2/3 快速改分类。`;
  }
  $("f-amount").focus();
}

function pickCandidate(i) {
  if (!preview || !preview.candidates || !preview.candidates[i]) return;
  const c = preview.candidates[i];
  $("f-category").value = c.category;
  $("f-subcategory").value = c.subcategory ?? "";
  confirm();
}

async function confirm() {
  if (!preview) return;
  const body = {
    amount: parseFloat($("f-amount").value),
    direction: $("f-direction").value,
    merchant: $("f-merchant").value || null,
    account: $("f-account").value || null,
    category: $("f-category").value || "其他",
    subcategory: $("f-subcategory").value || null,
    occurred_at: $("f-occurred").value || null,
    raw_text: preview.raw_text,
    note: $("f-note").value || null,
    confidence: preview.confidence,
    source: "manual",
  };
  const r = await fetch("/transactions", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  if (r.status === 409) { alert("重复账单 (dedup)"); return; }
  if (!r.ok) { alert("保存失败"); return; }
  const result = await r.json();
  lastInsertId = result.id;
  showUndo();
  reset(); refresh();
}

function showUndo() {
  const btn = $("undoBtn");
  btn.classList.remove("hidden");
  btn.textContent = "撤销最近一笔 (Ctrl+Z, 30s内)";
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { btn.classList.add("hidden"); lastInsertId = null; }, 30000);
}

async function undoLast() {
  if (!lastInsertId) return;
  const id = lastInsertId;
  lastInsertId = null;
  await fetch("/transactions/" + id, { method: "DELETE" });
  $("undoBtn").classList.add("hidden");
  refresh();
}

function reset() {
  preview = null;
  $("preview").classList.add("hidden");
  $("raw").value = "";
  $("raw").focus();
}

function renderRing(item) {
  const r = 28, c = 2 * Math.PI * r;
  const pct = Math.min(item.pct, 100);
  const off = c * (1 - pct / 100);
  const cls = `ring-${item.state}`;
  return `<div class="text-center">
    <svg viewBox="0 0 64 64" width="64" height="64">
      <circle class="ring-bg" cx="32" cy="32" r="${r}" />
      <circle class="ring-fg ${cls}" cx="32" cy="32" r="${r}"
              stroke-dasharray="${c}" stroke-dashoffset="${off}" />
    </svg>
    <div class="text-xs mt-1">${item.category}</div>
    <div class="text-xs text-slate-500">${item.pct}% · 剩 ¥${item.remaining}</div>
  </div>`;
}

async function refresh() {
  const txs = await (await fetch("/transactions?limit=20")).json();
  const list = $("txList");
  list.innerHTML = "";
  for (const t of txs) {
    const sign = t.direction === "expense" ? "-" : "+";
    const cls = t.direction === "expense" ? "text-rose-600" : "text-emerald-600";
    list.insertAdjacentHTML("beforeend", `
      <div class="py-2 flex justify-between gap-3">
        <div>
          <div class="font-medium">${t.merchant ?? "(未知商户)"} <span class="text-xs text-slate-400 ml-1">${t.category}/${t.subcategory ?? ""}</span></div>
          <div class="text-xs text-slate-500">${t.occurred_at} · ${t.account ?? ""} · ${t.source}</div>
        </div>
        <div class="${cls} font-mono">${sign}¥${Number(t.amount).toFixed(2)}</div>
      </div>`);
  }
  const stats = await (await fetch("/stats/category")).json();
  $("stats").innerHTML = stats.map(s =>
    `<div class="flex justify-between border-b py-1"><span>${s.category ?? "其他"}</span>
     <span class="font-mono">¥${s.total} (${s.count})</span></div>`).join("") || "<em>暂无数据</em>";

  if (features.budget_alerts) {
    try {
      const [budget, alerts] = await Promise.all([
        fetch("/budgets/status").then(r => r.json()),
        fetch("/alerts").then(r => r.json()),
      ]);
      if (budget.length) {
        $("budgetRings").classList.remove("hidden");
        $("budgetRings").innerHTML = `<div class="flex gap-4 overflow-x-auto">${budget.map(renderRing).join("")}</div>`;
      }
      if (alerts.length) {
        const msg = alerts.slice(0, 3).map(a => {
          if (a.kind === "category_spike") return `${a.category} 近 30 天日均 ¥${a.recent_daily_avg} (基线 ¥${a.baseline_daily_avg}, z=${a.z})`;
          if (a.kind === "new_merchant_spike") return `新商户 ${a.merchant} 单笔 ¥${a.amount} (中位 ¥${a.median})`;
          return JSON.stringify(a);
        }).join(" · ");
        $("alertBar").classList.remove("hidden");
        $("alertBar").className = "rounded-md p-3 bg-amber-50 border border-amber-200 text-sm text-amber-800";
        $("alertBar").innerHTML = "⚠ " + msg;
      } else {
        $("alertBar").classList.add("hidden");
      }
    } catch {}
  }
}

async function loadAliases() {
  if (!features.merchant_alias) return;
  const rows = await (await fetch("/aliases")).json();
  $("aliasList").innerHTML = rows.map(r => `
    <div class="flex justify-between items-center border-b py-1">
      <span>${r.alias} → <b>${r.canonical}</b></span>
      <button data-alias="${r.alias}" class="text-rose-600 text-xs remove-alias">删除</button>
    </div>`).join("") || "<em class='text-slate-400'>尚无别名</em>";
  [...document.querySelectorAll(".remove-alias")].forEach(b => {
    b.onclick = async () => {
      await fetch("/aliases/" + encodeURIComponent(b.dataset.alias), { method: "DELETE" });
      loadAliases();
    };
  });
}

// ---------- Reconcile ----------
let reconcileReport = null;

async function runReconcile() {
  const text = $("reconcileCsv").value.trim();
  if (!text) return;
  $("reconcileStats").textContent = "解析中...";
  const r = await fetch("/reconcile", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  if (!r.ok) { $("reconcileStats").textContent = "失败"; return; }
  reconcileReport = await r.json();
  renderReconcile();
}

function renderReconcile() {
  if (!reconcileReport) return;
  const s = reconcileReport.stats;
  $("reconcileStats").textContent =
    `已解析 ${s.total_statement_entries} 条 · 匹配 ${s.matched} · 漏记 ${s.missing_in_db} · 金额不符 ${s.amount_mismatch} · DB 多 ${s.missing_in_statement}`;
  const out = $("reconcileOut");
  out.innerHTML = "";
  if (reconcileReport.missing_in_db.length) {
    const rows = reconcileReport.missing_in_db.map((e, i) => `
      <tr class="border-b">
        <td class="p-1"><input type="checkbox" class="missing-chk" data-idx="${i}" checked /></td>
        <td class="p-1 text-slate-500">${e.occurred_at.replace("T", " ")}</td>
        <td class="p-1">${e.merchant || "-"}</td>
        <td class="p-1 text-right font-mono">${e.direction === "expense" ? "-" : "+"}¥${e.amount.toFixed(2)}</td>
      </tr>`).join("");
    out.insertAdjacentHTML("beforeend", `
      <div>
        <div class="font-medium text-rose-600">漏记 (${reconcileReport.missing_in_db.length})</div>
        <table class="w-full text-xs"><tbody>${rows}</tbody></table>
      </div>`);
    $("reconcileImport").classList.remove("hidden");
  }
  if (reconcileReport.amount_mismatch.length) {
    const rows = reconcileReport.amount_mismatch.map(m => `
      <li>${m.entry.occurred_at.replace("T"," ")} · ${m.entry.merchant || "-"} ·
          账单 ¥${m.entry.amount.toFixed(2)} vs 本地 ¥${Number(m.db_row.amount).toFixed(2)} (Δ ${m.delta})</li>`).join("");
    out.insertAdjacentHTML("beforeend", `
      <div><div class="font-medium text-amber-600">金额不符 (${reconcileReport.amount_mismatch.length})</div>
           <ul class="list-disc pl-4 text-xs text-slate-700">${rows}</ul></div>`);
  }
  if (reconcileReport.missing_in_statement.length) {
    out.insertAdjacentHTML("beforeend", `
      <div class="text-xs text-slate-500">本地存在但账单中没有：${reconcileReport.missing_in_statement.length} 条（可能是现金或手动录入）</div>`);
  }
}

async function importMissing() {
  if (!reconcileReport) return;
  const picks = [...document.querySelectorAll(".missing-chk")]
    .filter(c => c.checked)
    .map(c => reconcileReport.missing_in_db[parseInt(c.dataset.idx)]);
  if (!picks.length) return;
  const r = await fetch("/reconcile/import", { method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({entries: picks})});
  const j = await r.json();
  alert(`已导入 ${j.created.length} 条，重复跳过 ${j.duplicates.length} 条`);
  reconcileReport = null;
  $("reconcileOut").innerHTML = "";
  $("reconcileCsv").value = "";
  $("reconcileImport").classList.add("hidden");
  $("reconcileStats").textContent = "";
  refresh();
}

// ---------- Command palette ----------
let cmdDebounce = null;

function openCmd() {
  if (!features.command_palette) return;
  $("cmdPalette").classList.remove("hidden");
  $("cmdInput").value = "";
  $("cmdResults").innerHTML = "";
  $("cmdSummary").classList.add("hidden");
  $("cmdInput").focus();
}

function closeCmd() {
  $("cmdPalette").classList.add("hidden");
}

async function runCmdSearch() {
  const q = $("cmdInput").value.trim();
  if (!q) { $("cmdResults").innerHTML = ""; $("cmdSummary").classList.add("hidden"); return; }
  const r = await fetch("/search?q=" + encodeURIComponent(q) + "&limit=50");
  if (!r.ok) return;
  const j = await r.json();
  const filters = j.filter || {};
  const chips = Object.entries(filters).filter(([k,v]) => k !== "raw" && v !== "" && !(Array.isArray(v) && v.length === 0))
    .map(([k,v]) => `<span class="mr-2">${k}: <b>${Array.isArray(v) ? v.join(" ") : v}</b></span>`).join("");
  $("cmdSummary").innerHTML = `${j.total_count} 笔 · 合计 <b>¥${j.total_amount.toFixed(2)}</b>${chips ? ' · ' + chips : ''}`;
  $("cmdSummary").classList.remove("hidden");
  $("cmdResults").innerHTML = j.rows.map(t => {
    const sign = t.direction === "expense" ? "-" : "+";
    const cls = t.direction === "expense" ? "text-rose-600" : "text-emerald-600";
    return `<li class="px-3 py-2 hover:bg-slate-50">
      <div class="flex justify-between items-center">
        <div>
          <div class="font-medium">${t.merchant || "(未知)"} <span class="text-xs text-slate-400 ml-1">${t.category || ""}${t.subcategory ? '/' + t.subcategory : ''}</span></div>
          <div class="text-xs text-slate-500">${(t.occurred_at || "").replace("T"," ")} · ${t.account || ""}</div>
        </div>
        <div class="${cls} font-mono">${sign}¥${Number(t.amount).toFixed(2)}</div>
      </div></li>`;
  }).join("") || "<li class='px-3 py-4 text-slate-400 text-center'>无匹配</li>";
}

$("parseBtn").onclick = parseText;
$("confirmBtn").onclick = confirm;
$("cancelBtn").onclick = reset;
$("refreshBtn").onclick = refresh;
$("undoBtn").onclick = undoLast;
$("pasteBtn").onclick = async () => {
  try { $("raw").value = await navigator.clipboard.readText(); parseText(); }
  catch { $("hint").textContent = "浏览器拒绝读取剪贴板，请手动粘贴"; }
};

$("settingsBtn").onclick = () => {
  $("settings").classList.remove("hidden"); loadAliases();
  if (features.reconcile) $("reconcileSection").classList.remove("hidden");
};
$("settingsClose").onclick = () => $("settings").classList.add("hidden");
$("reconcileRun").onclick = runReconcile;
$("reconcileImport").onclick = importMissing;
$("cmdInput") && ($("cmdInput").oninput = () => {
  clearTimeout(cmdDebounce);
  cmdDebounce = setTimeout(runCmdSearch, 180);
});
$("cmdPalette") && ($("cmdPalette").onclick = (e) => { if (e.target.id === "cmdPalette") closeCmd(); });
$("aliasAdd").onclick = async () => {
  const a = $("aliasFrom").value.trim(), c = $("aliasTo").value.trim();
  if (!a || !c) return;
  await fetch("/aliases", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({alias: a, canonical: c, merge_history: true}) });
  $("aliasFrom").value = ""; $("aliasTo").value = "";
  loadAliases();
};
$("digestPreview").onclick = async () => {
  if (!features.daily_digest) { $("digestOut").textContent = "daily_digest 未启用，请在 config.yaml 打开"; $("digestOut").classList.remove("hidden"); return; }
  const d = await (await fetch("/digest/today")).json();
  $("digestOut").textContent = d.title + "\n\n" + d.body;
  $("digestOut").classList.remove("hidden");
};
$("digestTest").onclick = async () => {
  if (!features.daily_digest) return;
  const r = await fetch("/digest/test", { method: "POST" });
  const j = await r.json();
  $("digestOut").textContent = j.sent ? "已推送到微信 ✓" : "推送失败，请检查 SENDKEY";
  $("digestOut").classList.remove("hidden");
};

document.addEventListener("keydown", (e) => {
  // Ctrl/Cmd+K → command palette (global)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if ($("cmdPalette").classList.contains("hidden")) openCmd(); else closeCmd();
    return;
  }
  // If command palette is open, Esc closes it
  if (!$("cmdPalette").classList.contains("hidden")) {
    if (e.key === "Escape") { e.preventDefault(); closeCmd(); }
    return;
  }
  if (e.ctrlKey && e.key.toLowerCase() === "z" && lastInsertId) { e.preventDefault(); undoLast(); return; }
  if (!preview) {
    if (e.key === "Enter" && e.target.id === "raw") { e.preventDefault(); parseText(); }
    return;
  }
  // while preview visible
  if (e.key >= "1" && e.key <= "9") {
    const idx = parseInt(e.key) - 1;
    if (preview.candidates && preview.candidates[idx] && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
      e.preventDefault();
      pickCandidate(idx);
      return;
    }
  }
  if (e.key === "Enter" && e.target.tagName === "INPUT") {
    e.preventDefault(); confirm();
  } else if (e.key === "Escape") { reset(); }
});

loadFeatures().then(refresh);
</script>
</body>
</html>
